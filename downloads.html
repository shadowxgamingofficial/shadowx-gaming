<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowX Gaming - Games & Apps</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: #111;
      border-bottom: 2px solid #00f2ea;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #aaa;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 15px;
    }

    .section-title {
      color: #00f2ea;
      margin-top: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .card {
      background: #151515;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #333;
      box-shadow: 3px 3px 0 #ff0050;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: #aaa;
      line-height: 1.5;
    }

    .download {
      display: inline-block;
      margin-top: 10px;
      padding: 11px 18px;
      background: #00f2ea;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }

    .download:hover {
      background: #ff0050;
      color: white;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 ShadowX Gaming</h1>
  <p>Games & Apps Download Center</p>
</header>

<div class="container">

  <h2 class="section-title">🎮 Games</h2>

  <div class="grid">

    <div class="card">
      <h3>Game Name</h3>
      <p>Your game description goes here.</p>
      <p>📦 Size: 500 MB</p>

      <a class="download"
         href="YOUR-GAME-FILE-LINK"
         download>
        Download
      </a>
    </div>

    <div class="card">
      <h3>Another Game</h3>
      <p>Your game description goes here.</p>
      <p>📦 Size: 1 GB</p>

      <a class="download"
         href="YOUR-GAME-FILE-LINK"
         download>
        Download
      </a>
    </div>

  </div>


  <h2 class="section-title">📱 Apps</h2>

  <div class="grid">

    <div class="card">
      <h3>App Name</h3>
      <p>Your app description goes here.</p>
      <p>📦 Size: 50 MB</p>

      <a class="download"
         href="YOUR-APP-FILE-LINK"
         download>
        Download
      </a>
    </div>

  </div>

</div>

<footer>
  © 2026 ShadowX Gaming
</footer>

</body>
</html>
